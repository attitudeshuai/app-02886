services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: git-doc-fetcher-backend
    ports:
      - "8000:8000"
    volumes:
      - repo_data:/app/data/repos
      - db_data:/app/data/db
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=sqlite:///./data/db/app.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - app-network

  frontend-user:
    build:
      context: ./frontend-user
      dockerfile: Dockerfile
    container_name: git-doc-fetcher-frontend
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app-network

volumes:
  repo_data:
    driver: local
  db_data:
    driver: local

networks:
  app-network:
    driver: bridge
